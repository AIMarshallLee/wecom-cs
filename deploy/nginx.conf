# ============================================================
# wecom-cs Nginx 反向代理配置
# 监听 80 -> 反向代理到 127.0.0.1:8000 (gunicorn)
# 支持 WebSocket（企业微信回调需要）
# 使用方式：include 到 nginx 的 http{} 上下文中
# ============================================================

# WebSocket 升级映射：Upgrade 头存在时保持长连接，否则关闭
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 请求体大小限制（企业微信回调 / 上传场景）
    client_max_body_size 10M;

    # 超时设置 60s
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    send_timeout          60s;

    # 基本安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 访问日志
    access_log /var/log/nginx/wecom-cs-access.log;
    error_log  /var/log/nginx/wecom-cs-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket 支持（企业微信回调需要）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 透传客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # 健康检查端点（可选：直接透传，不记日志）
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
        error_log off;
    }
}
